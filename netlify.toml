# Netlify build settings. Having these in the repo means the site deploys
# correctly on the first try, with nothing to configure in the dashboard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro emits a real 404 page; serve it with the right status code.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Hashed asset filenames are content-addressed, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
